name: Bug report
description: Something behaved differently than documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Boost decides what to compact — output passing through unchanged is
        normal and usually not a bug. Shell compaction is off by default since
        Boost 0.14.6 (`/boost settings` → Shell output), and file reads, `grep`,
        `find` and `ls` are never compacted. `/boost status` in pi and
        `boost doctor` in a terminal are good first checks.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pi -e ... / pi install npm:pi-jfrog-boost
        2. Ask the agent to run ...
        3. ...
    validations: { required: true }
  - type: textarea
    id: status
    attributes:
      label: /boost status
      description: |
        Run `/boost status` in pi (the session where it happened, if you can) and
        paste the output. It shows the Boost binary and version, which surfaces
        are on and why, the breaker, and this session's skip and error counters.
        It contains no tool output, but it does show your binary and settings
        paths; trim anything you'd rather not share.
      render: text
    validations: { required: true }
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `pi --version`, `boost version`, `node --version`, and your OS.
      render: shell
    validations: { required: true }
  - type: checkboxes
    id: failopen
    attributes:
      label: Fail-open check
      options:
        - label: I confirmed the behaviour goes away with `DISABLE_BOOST=1` (or `pi --no-boost=true`)
